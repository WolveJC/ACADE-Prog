name: PR Management

on:
  pull_request:
    types: [opened]

jobs:
  label:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Automatic Labeler
        uses: actions/labeler@v6 
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml 

  conventional-title:
    name: AI Conventional Pull Request & Description
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run AI PR Augmenter Script
        uses: actions/github-script@v9
        env:
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        with:
          script: |
            const script = require('./scripts/pr_augmenter.js');
            await script.run({
              context,
              github,
              geminiApiKey: process.env.GEMINI_API_KEY
            });
