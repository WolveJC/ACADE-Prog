name: Ruff Lint Format & Test

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        python-version: [ "3.8", "3.11", "3.14" ]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f unidad_3/Flask/requisitos.txt ]; then pip install -r unidad_3/Flask/requisitos.txt; fi
          if [ -f unidad_3/Flask/requisitos-dev.txt ]; then pip install -r unidad_3/Flask/requisitos-dev.txt; fi
          if [ -f unidad_7/pystock_management/requisitos.txt ]; then pip install -r unidad_7/pystock_management/requisitos.txt; fi
          pip install pytest pytest-cov

      # --- LINTER (Corrige y reporta errores de código) ---
      - name: Ejecutar Ruff Check
        id: ruff_check
        continue-on-error: true
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --fix"

      # --- FORMATO (Aplica el formato automáticamente) ---
      - name: Ejecutar Ruff Format 
        uses: astral-sh/ruff-action@v3
        with:
          args: "format"

      # --- TESTS ---
      - name: Ejecutar Tests con Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/unidad_3/Flask:${{ github.workspace }}/unidad_7/pystock_management:${{ github.workspace }}
        run: |
          pytest tests/ unidad_3/Flask/tests/ --cov=unidad_1 --cov=unidad_3/Flask --cov-report=term-missing

      - name: Evaluar resultados del Linter
        if: steps.ruff_check.outcome == 'failure'
        run: |
          echo "Se encontraron errores de linter no corregibles automáticamente."
          exit 1

      # Auto-commit si el formateador ajustó algo en la rama de trabajo actual (push)
      - name: Commit formatted changes
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: auto-format python files via Ruff [CI]" || echo "No changes to format"
          git pull --rebase origin ${{ github.ref_name }} || echo "No remote changes to pull"
          git push origin HEAD:${{ github.ref_name }} || echo "Push skipped due to concurrent updates"