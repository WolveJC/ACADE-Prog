name: Build Docs

on:
  workflow_run:
    workflows: ["Ruff Lint Format & Test"]
    types:
      - completed #Solo se ejecuta si Ruff termino (exit 0)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- 1. JOB DE FILTRADO NATIVO ---
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_markdown.outputs.run_build }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Vital para poder comparar

      - name: Verificar si hay cambios en archivos Markdown (.md)
        id: check_markdown
        run: |
          # Si se disparó manualmente, forzamos la ejecución
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Comprobamos exactamente qué archivos cambiaron en este push
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          echo "Archivos modificados:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q "\.md$"; then
            echo "Se detectaron archivos .md"
            echo "run_build=true" >> $GITHUB_OUTPUT
          else
            echo "No hay cambios en archivos .md"
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi

  # --- 2. JOB DE CONSTRUCCIÓN (Solo corre si el anterior detectó .md) ---
  docs:
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true' && (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install markdown pandocfilters emoji requests

      - name: Generate projects.json
        run: python scripts/scan_projects.py

      - name: Generate GLOBAL.md
        run: python scripts/concat_readmes.py

      - name: Install Pandoc & LaTeX
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          sudo apt-get install -y texlive texlive-xetex texlive-fonts-recommended texlive-latex-extra
          sudo apt-get install -y librsvg2-bin fonts-dejavu

      - name: Prepare font header
        run: |
          cat > pandoc-fonts.tex <<'EOF'
          \usepackage{fontspec}
          \setmainfont{DejaVu Sans}
          \setsansfont{DejaVu Sans}
          \setmonofont{DejaVu Sans Mono}
          EOF

      - name: Convert to PDF
        run: pandoc GLOBAL.md -o doc_proj.pdf --pdf-engine=xelatex --include-in-header=pandoc-fonts.tex --filter ./scripts/emoji_filter.py

      - name: Move artifacts into repo
        run: |
          mkdir -p Wolves-Page/public/docs
          mkdir -p Wolves-Page/src/data
          mv doc_proj.pdf Wolves-Page/public/docs/doc_proj.pdf
          mv projects.json Wolves-Page/src/data/projects_list.json

      - name: Commit and push artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Wolves-Page/public/docs/doc_proj.pdf Wolves-Page/src/data/projects_list.json
          git commit -m "Update docs and projects list [CI]" || echo "No changes to commit"
          git pull --rebase origin main || echo "No remote changes to pull"
          git push

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          cp GLOBAL.md _site/GLOBAL.md

      - name: Deploy GLOBAL.md to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          keep_files: true
