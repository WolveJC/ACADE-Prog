# Etiquetas automáticas según cambios en archivos o ramas

# ==============================================================================
# 1. ETIQUETAS POR LENGUAJE Y TECNOLOGÍA (lang:)
# ==============================================================================
"lang:cpp":
  - changed-files:
      - any-glob-to-any-file: "Curso-CPP/**"

"lang:python":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.py"
          - "pyproject.toml"

"lang:react":
  - changed-files:
      - any-glob-to-any-file: "Wolves-Page/**"

"lang:flask":
  - changed-files:
      - any-glob-to-any-file: "unidad_3/Flask/**"

"lang:web-backend":
  - changed-files:
      - any-glob-to-any-file:
          - "Wolves-Page-Backend/**"
          - "unidad_3/Flask/**"

# ==============================================================================
# 2. ETIQUETAS POR MÓDULOS Y UNIDADES ACADÉMICAS (unidad: / curso:)
# ==============================================================================
"curso:cpp":
  - changed-files:
      - any-glob-to-any-file: "Curso-CPP/**"

"unidad:1":
  - changed-files:
      - any-glob-to-any-file: "unidad_1/**"

"unidad:2":
  - changed-files:
      - any-glob-to-any-file: "unidad_2/**"

"unidad:3":
  - changed-files:
      - any-glob-to-any-file: "unidad_3/**"

"unidad:7":
  - changed-files:
      - any-glob-to-any-file: "unidad_7/**"

# ==============================================================================
# 3. ETIQUETAS POR COMPONENTES Y ÁREAS (project: / area:)
# ==============================================================================
"project:wolves-page":
  - changed-files:
      - any-glob-to-any-file: "Wolves-Page/**"

"project:wolves-backend":
  - changed-files:
      - any-glob-to-any-file: "Wolves-Page-Backend/**"

"area:scripts":
  - changed-files:
      - any-glob-to-any-file: "scripts/**"

"area:tests":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "**/tests/**"

"area:styles":
  - changed-files:
      - any-glob-to-any-file:
          - "**/styles/**"
          - "**/*.css"
          - "**/*.scss"
          - "**/*.sass"

# ==============================================================================
# 4. CI/CD, AUTOMATIZACIÓN Y SEGURIDAD (ci: / security)
# ==============================================================================
"ci:github-actions":
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

"ci:codeql":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/codeql*"
          - ".github/codeql/**"

"ci:deploy":
  - changed-files:
      - any-glob-to-any-file:
          - "Wolves-Page/vercel.json"
          - "**/Dockerfile"

"security":
  - changed-files:
      - any-glob-to-any-file: "SECURITY.md"

# ==============================================================================
# 5. DEPENDENCIAS Y ENTORNO (deps:)
# ==============================================================================
"deps:python":
  - changed-files:
      - any-glob-to-any-file:
          - "**/requirements*.txt"
          - "**/requisitos*.txt"
          - "pyproject.toml"

"deps:node":
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "**/package-lock.json"

"deps:cpp":
  - changed-files:
      - any-glob-to-any-file:
          - "Makefile"
          - "build_*.sh"

# ==============================================================================
# 6. TIPO DE RECURSO / DOCUMENTACIÓN (documentation)
# ==============================================================================
"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "**/*.pdf"